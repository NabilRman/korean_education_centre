{% extends "base.html" %}

{% block content %}
<div class="password-reset-container">
    <h2>Password Reset</h2>
    
    <p>Forgotten your password? Enter your email address below, and we'll send you instructions for setting a new one.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Reset My Password</button>
    </form>

    <p class="mt-3">
        <a href="{% url 'login' %}">Return to Login</a>
    </p>
</div>
{% endblock %}
